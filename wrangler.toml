name = "travel-plan-private"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-30"

# D1 is configured here. The private R2 bucket will be created separately.
# Do not put credentials or secrets in this file.

[[d1_databases]]
binding = "TRAVEL_DB"
database_name = "travel-plan-private-db"
database_id = "0f21ffd7-f9a7-4de8-b93a-ec95a497c61b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRAVEL_ATTACHMENTS"
bucket_name = "travel-plan-private-attachments"

[[rules]]
type = "Text"
globs = ["trip-data.json"]
